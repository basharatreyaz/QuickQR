<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - QuickQR SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body>

  <nav class="navbar" style="background:transparent;border:none;">
    <a href="index.html" class="brand-logo">
      <div class="logo-icon"><i class="fas fa-qrcode"></i></div>
      QuickQR
    </a>
    <div>
      <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.75rem;">
        <div style="width:48px;height:48px;border-radius:12px;background:var(--primary-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:1rem;">
          <i class="fas fa-lock"></i>
        </div>
        <h1 style="font-size:1.6rem;font-weight:800;color:var(--slate-900);margin-bottom:0.35rem;">Set New Password</h1>
        <p style="color:var(--slate-500);font-size:0.9rem;">Create a strong, secure new password for your QuickQR account.</p>
      </div>

      <div id="missing-token-box" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:1rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;font-size:0.875rem;line-height:1.5;">
        <div style="font-weight:700;display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;">
          <i class="fas fa-exclamation-triangle"></i> Reset Link Required
        </div>
        <p style="margin:0 0 0.75rem 0;">No valid reset token was detected in your link. Reset links expire after 1 hour.</p>
        <a href="forgot-password.html" class="btn btn-outline btn-sm" style="background:#fff;color:#991b1b;border-color:#fca5a5;">
          <i class="fas fa-arrow-left"></i> Request New Reset Link
        </a>
      </div>

      <form id="reset-password-form">
        <input type="hidden" id="token" value="">
        <div class="form-group">
          <label class="form-label" for="email">Account Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required minlength="6">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;padding:0.75rem;">
          <i class="fas fa-check-circle"></i> Update Password
        </button>
      </form>

      <div style="margin-top:1.5rem;text-align:center;">
        <a href="login.html" style="font-size:0.875rem;color:var(--slate-600);text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;">
          <i class="fas fa-arrow-left"></i> Back to sign in
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    const tokenParam = urlParams.get('token');

    if (emailParam) {
      document.getElementById('email').value = emailParam;
    }
    if (tokenParam) {
      document.getElementById('token').value = tokenParam;
    } else {
      document.getElementById('missing-token-box').style.display = 'block';
      document.getElementById('btn-submit').disabled = true;
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value.trim();
      const email = document.getElementById('email').value.trim();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('confirm-password').value;
      const btn = document.getElementById('btn-submit');

      if (!token) {
        API.showToast('Reset token is missing. Please request a new link.', 'error');
        return;
      }
      if (!email) {
        API.showToast('Please enter your email address.', 'error');
        return;
      }
      if (p1 !== p2) {
        API.showToast('Passwords do not match.', 'error');
        return;
      }
      if (p1.length < 6) {
        API.showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try {
        const res = await API.post('/auth/reset-password.php', { token, email, new_password: p1 });
        API.showToast(res.message || 'Password updated successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Update Password';
        API.showToast(err.message || 'Failed to reset password.', 'error');
      }
    });
  </script>
</body>
</html>
