<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - QuickQR SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }
    .quick-fill {
      background: var(--slate-50);
      border: 1px dashed var(--slate-300);
      border-radius: var(--radius-lg);
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>

  <nav class="navbar" style="background:transparent;border:none;">
    <a href="index.html" class="brand-logo">
      <div class="logo-icon"><i class="fas fa-qrcode"></i></div>
      QuickQR
    </a>
    <div>
      <span style="font-size:0.875rem;color:var(--slate-600);margin-right:0.5rem;">Don't have an account?</span>
      <a href="register.html" class="btn btn-outline btn-sm">Sign Up</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1.75rem;">
        <h1 style="font-size:1.6rem;font-weight:800;color:var(--slate-900);margin-bottom:0.35rem;">Welcome Back</h1>
        <p style="color:var(--slate-500);font-size:0.9rem;">Sign in to manage and track your QR codes</p>
      </div>

      <!-- Quick-fill Demo Accounts -->
      <div class="quick-fill">
        <div style="font-weight:700;color:var(--slate-700);margin-bottom:0.35rem;">Quick Demo Fill:</div>
        <div style="display:flex;gap:0.5rem;">
          <button type="button" onclick="fillCreds('demo@example.com', 'admin123')" class="btn btn-outline btn-sm" style="flex:1;">
            <i class="fas fa-user"></i> Demo User
          </button>
          <button type="button" onclick="fillCreds('admin@example.com', 'admin123')" class="btn btn-outline btn-sm" style="flex:1;">
            <i class="fas fa-shield-alt"></i> Admin
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@domain.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            <a href="forgot-password.html" style="font-size:0.775rem;">Forgot Password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;padding:0.75rem;">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillCreds(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    // Auto-fill from URL parameters (e.g. login.html?fill=admin)
    const urlParams = new URLSearchParams(window.location.search);
    const fillTarget = urlParams.get('fill') || urlParams.get('role');
    if (fillTarget === 'admin') {
      fillCreds('admin@example.com', 'admin123');
    } else if (fillTarget === 'demo' || fillTarget === 'user') {
      fillCreds('demo@example.com', 'admin123');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/auth/login.php', { email, password });
        API.showToast('Login successful! Redirecting...', 'success');
        
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';

        setTimeout(() => {
          window.location.href = redirect;
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        API.showToast(err.message || 'Login failed.', 'error');
      }
    });

    // If already logged in, redirect to dashboard
    API.get('/auth/me.php').then(res => {
      if (res.data) window.location.href = 'dashboard.html';
    }).catch(() => {});
  </script>
</body>
</html>
